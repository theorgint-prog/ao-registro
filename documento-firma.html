      <div id="firmaZone" style="margin-top:2rem;border-top:1.5px dashed #ccc;padding-top:1.5rem">
        <div style="background:#EEF3FC;border-radius:8px;padding:1rem;border:1px solid #C0CCE8;margin-bottom:1rem">
          <div style="font-size:9px;color:#1A2A6C;font-weight:600;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.04em">✍️ Firma — ${el_la==='la'?'La':'El'} ${colaborador}</div>
          <input type="text" id="firmaInput" placeholder="${P_nombre}" style="width:100%;padding:7px 10px;border:1.5px solid #4A90D9;border-radius:6px;font-size:13px;font-family:inherit;outline:none">
          <div id="firmaDisplay" style="font-family:Georgia,serif;font-style:italic;font-size:17px;color:#1A2A6C;min-height:26px;margin-top:6px;padding:4px 0;border-bottom:1.5px solid #1A2A6C"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:10.5px;color:#333;margin-bottom:1rem;cursor:pointer">
          <input type="checkbox" id="aceptoChk" style="margin-top:2px">
          <span>Declaro haber leído, comprendido y recibido este documento en su totalidad.</span>
        </label>
        <div id="errBox" style="display:none;color:#B23A3A;font-size:10.5px;margin-bottom:.75rem"></div>
        <button class="btn-firmar no-print" id="btnFirmar" onclick="enviarFirma()">✍️ Firmar y enviar</button>
      </div>
    </div>
    <div class="footer">${P_empresa} · ${empresaDireccion} · Tlf: 04121237130</div>
  </div>`;

  const fi = document.getElementById('firmaInput');
  fi.addEventListener('input', () => { document.getElementById('firmaDisplay').textContent = fi.value; });
}

async function enviarFirma(){
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  const firma = (document.getElementById('firmaInput').value || '').trim();
  const acepto = document.getElementById('aceptoChk').checked;
  if(!firma){ errBox.textContent = '⚠️ Por favor escribe tu nombre en el campo de firma.'; errBox.style.display='block'; return; }
  if(!acepto){ errBox.textContent = '⚠️ Debes marcar la casilla de aceptación para continuar.'; errBox.style.display='block'; return; }

  const btn = document.getElementById('btnFirmar');
  btn.disabled = true; btn.textContent = '⏳ Enviando...';

  try{
    const res = await fetch(SB_URL + '/rest/v1/documentos_firmados', {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        nombre: P_nombre,
        email_va: P_email,
        empresa: P_empresa,
        tipo: P_tipo,
        motivo: P_motivo,
        firma: firma,
        acepto_terminos: true,
        fecha_firma: new Date().toISOString()
      })
    });
    if(!res.ok){ throw new Error('Error al guardar la firma (' + res.status + ')'); }
    document.getElementById('app').innerHTML = `
      <div class="msg">
        <div style="font-size:28px;margin-bottom:1rem">✅</div>
        <div style="font-weight:600;font-size:15px;margin-bottom:.5rem">Documento firmado correctamente</div>
        <div>Gracias, ${firstName}. Tu firma fue registrada y enviada a Recursos Humanos.</div>
      </div>`;
  }catch(e){
    btn.disabled = false; btn.textContent = '✍️ Firmar y enviar';
    errBox.textContent = '❌ ' + e.message;
    errBox.style.display = 'block';
  }
}

renderDoc();
</script>
</body></html>
